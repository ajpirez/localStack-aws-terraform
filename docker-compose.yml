services:
  localstack:
    container_name: ${LOCALSTACK_DOCKER_NAME:-localstack-main}
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566" # Gateway (HTTP y HTTPS)
      - "127.0.0.1:4510-4559:4510-4559" # Puertos extra (Lambda, etc.)
      - "127.0.0.1:443:443" # Gateway HTTPS
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack
      # Docker Desktop en este Mac expone el socket aquí, no en /var/run/docker.sock.
      - ${LAMBDA_DOCKER_SOCK:-${HOME}/.docker/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
