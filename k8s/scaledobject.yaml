apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: localstack-aws
  namespace: jobs
spec:
  secretTargetRef:
    - parameter: awsAccessKeyID
      name: localstack-aws
      key: AWS_ACCESS_KEY_ID
    - parameter: awsSecretAccessKey
      name: localstack-aws
      key: AWS_SECRET_ACCESS_KEY
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: jobs-worker
  namespace: jobs
spec:
  scaleTargetRef:
    name: jobs-worker
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: localstack-aws
      metadata:
        queueURL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/demo-jobs
        queueLength: "5"
        awsRegion: us-east-1
        awsEndpoint: http://host.docker.internal:4566
