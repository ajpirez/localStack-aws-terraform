apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: jobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels:
        app: jobs-api
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - host.docker.internal
            - localhost.localstack.cloud
            - sqs.us-east-1.localhost.localstack.cloud
      containers:
        - name: api
          image: jobs-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: localstack-aws
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
  namespace: jobs
spec:
  type: NodePort
  selector:
    app: jobs-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
